<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaatham Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 30px;
        }

        .dashboard {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .packages {
            display: grid;
            gap: 15px;
        }

        .package {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .package h3 {
            margin-top: 0;
        }

        .price {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Kaatham Admin</h1>
</header>

<main class="dashboard">

    <div class="top-bar">
        <div>
            <h2>Packages</h2>
            <p>Manage your travel packages.</p>
        </div>
    </div>

    <div class="packages" id="admin-packages">
        Loading packages...
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://vitjgnihandcyhupnrvd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_d8TT3ezUWAIWEyw2lERu7A_hBn7-eMa";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function loadAdminPackages() {

        const { data, error } = await supabaseClient
            .from('packages')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            document.getElementById('admin-packages').innerHTML =
                '<p>Could not load packages.</p>';
            return;
        }

        const container = document.getElementById('admin-packages');

        container.innerHTML = '';

        data.forEach(pkg => {

            const packageElement = document.createElement('div');

            packageElement.className = 'package';

            packageElement.innerHTML = `
                <h3>${pkg.title}</h3>
                <p>${pkg.destination}</p>
                <p>${pkg.description}</p>
                <p>${pkg.duration}</p>
                <p class="price">₹${pkg.price}</p>
            `;

            container.appendChild(packageElement);
        });
    }

    loadAdminPackages();
</script>

</body>
</html>
