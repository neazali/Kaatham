<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trek with Us | Explore India</title>
  <link rel="stylesheet" href="style.css">

  <!-- Fonts: Fraunces (display serif, echoes the hand-set feel of the Spiti poster) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>

  <!-- reuse your nav here -->
   
<section class="trek-hero" id="trek-hero">
  <div class="snow-layer" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="trek-hero-content">
    <p class="eyebrow reveal-el">Off the road</p>
    <h1 class="section-title reveal-el">Trek with Us.</h1>
    <p class="section-lead reveal-el">Choose your trail across the Himalayas.</p>
  </div>
</section>

   <header class="navbar" id="navbar" style="background:rgba(20,24,29,0.86); backdrop-filter: blur(14px);">
    <div class="container navbar-inner">
      <a href="#home" class="brand" aria-label="Kaatham home">
        <img src="kaatham-logo-white.png" alt="Kaatham logo" class="brand-logo">
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Primary navigation">
        <a href="#home" class="nav-link">Home</a>
        <a href="#destinations" class="nav-link">Destinations</a>
        <a href="#packages" class="nav-link">Trips</a>
        <a href="#experiences" class="nav-link">Experiences</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#contact" class="nav-link">Contact</a>
        <a href="#enquiry" class="btn btn-small btn-accent nav-cta">Plan a Trip</a>
      </nav>

      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <section class="section destinations" id="treks">

    <!-- =========================================
     ANIMATED HIMALAYAN BACKGROUND
     ========================================= -->

<div class="kaatham-trek-scene" aria-hidden="true">

  <!-- Soft mountain layers -->
  <svg class="kaatham-mountain mountain-far"
       viewBox="0 0 1400 420"
       preserveAspectRatio="none">

    <path d="
      M0 330
      L120 250
      L220 315
      L390 150
      L520 275
      L700 105
      L850 270
      L1040 155
      L1190 285
      L1400 180
      L1400 420
      L0 420
      Z
    "/>

  </svg>


  <svg class="kaatham-mountain mountain-near"
       viewBox="0 0 1400 360"
       preserveAspectRatio="none">

    <path d="
      M0 300
      L170 190
      L290 270
      L460 115
      L590 250
      L760 135
      L900 265
      L1080 125
      L1220 250
      L1400 155
      L1400 360
      L0 360
      Z
    "/>

  </svg>


  <!-- Moving mist -->

  <div class="kaatham-mist mist-a"></div>
  <div class="kaatham-mist mist-b"></div>


  <!-- Ridge -->

  <svg class="kaatham-ridge"
       viewBox="0 0 1400 260"
       preserveAspectRatio="none">

    <path d="
      M0 210
      C180 155 290 190 420 125
      C550 60 690 160 820 120
      C970 75 1080 170 1190 120
      C1280 85 1350 105 1400 80
      L1400 260
      L0 260
      Z
    "/>

  </svg>


  <!-- Hiker -->

  <div class="kaatham-hiker">

    <div class="hiker-head"></div>

    <div class="hiker-body"></div>

    <div class="hiker-backpack"></div>

    <div class="hiker-arm"></div>

    <div class="hiker-leg hiker-leg-one"></div>

    <div class="hiker-leg hiker-leg-two"></div>

    <div class="hiker-stick"></div>

  </div>

</div>

    <div class="container">
      <p class="eyebrow reveal-el">Off the road</p>
      <h2 class="section-title reveal-el">Trek with Us.</h2>
      <p class="section-lead reveal-el">Choose your trail across the Himalayas.</p>

      <div class="dest-grid reveal-el" id="treksGrid">
        <p>Loading treks...</p>
      </div>
    </div>
  </section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
